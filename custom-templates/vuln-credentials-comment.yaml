id: vuln-credentials-comment

info:
  name: Hardcoded Credentials in HTML Comments
  author: Z-tianyuan
  severity: medium
  description: 页面 HTML 注释中包含测试账号密码 admin / admin123，攻击者可利用此凭证登录后台
  tags: vuln,credentials,misconfig,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    # Check both the main login page and the admin panel for test credentials
    matchers:
      - type: word
        part: body
        words:
          - "test credentials"
          - "admin"
        condition: and
