<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header { text-align: center; padding: 3rem 0 2rem; }
        header h1 { font-size: 2.5rem; color: #38bdf8; margin-bottom: 0.5rem; }
        header p { color: #94a3b8; font-size: 1.1rem; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                 gap: 1.5rem; margin: 2rem 0; }
        .card { background: #1e293b; border-radius: 12px; padding: 1.5rem;
                border: 1px solid #334155; }
        .card h3 { color: #38bdf8; margin-bottom: 0.75rem; }
        .card p { color: #94a3b8; line-height: 1.6; }
        .card .icon { font-size: 2rem; margin-bottom: 0.5rem; }
        footer { text-align: center; padding: 2rem; color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NucleiAI</h1>
            <p>AI增强漏洞管理平台 — 智能扫描 · 误报过滤 · 中文报告</p>
        </header>

        <div class="cards">
            <div class="card">
                <div class="icon">🔍</div>
                <h3>智能扫描</h3>
                <p>基于 Nuclei 引擎，支持自动指纹识别与模板推荐，覆盖 OWASP Top 10 漏洞类型。</p>
            </div>
            <div class="card">
                <div class="icon">🧠</div>
                <h3>AI 误报过滤</h3>
                <p>LLM 驱动的二次研判引擎，对每条扫描结果进行上下文分析，有效降低误报率。</p>
            </div>
            <div class="card">
                <div class="icon">📄</div>
                <h3>中文报告生成</h3>
                <p>一键生成符合 GB/T 标准的中文渗透测试报告，包含漏洞详情与修复建议。</p>
            </div>
        </div>

        <footer>
            <p>Built with FastAPI + Nuclei + Ollama</p>
        </footer>
    </div>
</body>
</html>
